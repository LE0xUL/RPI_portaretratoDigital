{% extends "base.html" %}
{% block title %}Iniciar sesión — Portarretrato{% endblock %}
{% block body %}
<div class="login-page">
  <button type="button" class="theme-toggle theme-toggle--floating" data-theme-toggle aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>

  <div class="login-card">
    <div class="login-sprocket" aria-hidden="true"></div>
    <span class="login-eyebrow">Rollo 001 · Cuadro 24</span>
    <h1>Portarretrato<em>.</em></h1>
    <p class="muted">Ingresá el código de invitación para administrar las fotos.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="password" name="code" placeholder="Código de invitación" autofocus required autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <div class="login-sprocket" aria-hidden="true"></div>
  </div>
</div>
{% endblock %}
