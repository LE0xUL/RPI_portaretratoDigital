services:
  photoframe:
    build: .
    container_name: photoframe
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: photoframe-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - photoframe
